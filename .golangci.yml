# golangci-lint v2 configuration. Runs locally (if installed) via the pre-commit
# hook and always in CI. See ADR-0007.
version: "2"

linters:
  # The standard set: errcheck, govet, ineffassign, staticcheck, unused.
  default: standard
  enable:
    # Tests must live in an external _test package, so they exercise the brick
    # through its public interface (the same thing other bricks see).
    - testpackage
  exclusions:
    paths:
      # Scratch programs must still compile and vet (go build ./... covers
      # them) but are not held to the linter.
      - ^development/
    rules:
      # The in-repo tooling is package main and tests its own helpers directly.
      - path: ^tools/
        linters: [testpackage]

formatters:
  enable:
    - gofmt
    - goimports
